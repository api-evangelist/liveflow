name: LiveFlow
description: LiveFlow is an agentic accounting and FP&A platform that connects accounting
  systems such as QuickBooks and Xero to real-time financial reporting, consolidation,
  and forecasting. Its Flow product automates month-end close, reconciliation, accounts-receivable
  management, and journal entries across multiple entities, while LiveFlow FP&A automates
  consolidation, reporting, and forecasting on a company's existing systems. The platform
  targets complex, multi-location businesses in construction, healthcare, food & beverage,
  and retail. LiveFlow is backed by Seedcamp.
